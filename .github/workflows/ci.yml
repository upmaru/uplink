name: "CI"

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "hotfix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependencies
    runs-on: warp-ubuntu-2204-x64-2x
    container:
      image: alpine:3.20

    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OS Deps
        run: |
          apk update && apk add --update tar build-base libsodium-dev \
            elixir nodejs npm erlang-dialyzer

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v5
        id: mix-cache
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-uplink-${{ hashFiles('mix.lock') }}-v4

      - name: Install Dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p priv/plts
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile
          MIX_ENV=test mix deps.compile
          MIX_ENV=test mix opsmo.embed
          mix dialyzer --plt

        env:
          POSTGRES_HOST: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}

  static_code_analysis:
    name: Static Code Analysis
    needs: deps
    runs-on: warp-ubuntu-2204-x64-2x
    container:
      image: alpine:3.20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          apk update && apk add --update tar build-base libsodium-dev \
            elixir nodejs npm erlang-dialyzer
          mix local.rebar --force
          mix local.hex --force

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v5
        id: mix-cache
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-uplink-${{ hashFiles('mix.lock') }}-v4

      - name: Check Code Format
        run: mix format --check-formatted

      - name: Run Dialyzer
        run: mix dialyzer --no-check --halt-exit-status

  test:
    name: Unit Tests
    needs: deps
    runs-on: warp-ubuntu-2204-x64-2x
    container:
      image: alpine:3.20

    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          apk update && apk add --update tar build-base libsodium-dev \
            elixir nodejs npm erlang-dialyzer
          mix local.rebar --force
          mix local.hex --force

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v5
        id: mix-cache
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-uplink-${{ hashFiles('mix.lock') }}-v4

      - name: Run Tests
        run: |
          mix test --trace --slowest 10

        env:
          POSTGRES_HOST: postgres
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
